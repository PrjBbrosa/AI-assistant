name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (ubuntu, offscreen)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Install Qt offscreen runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libx11-xcb1 \
            libfontconfig1 \
            libfreetype6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Whitespace check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
            git diff --check "$PR_BASE_SHA...HEAD"
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check "$PUSH_BEFORE_SHA..HEAD"
          else
            git diff --check "HEAD^..HEAD"
          fi

  windows-smoke:
    name: Windows build and launch smoke
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: Test packaged provenance contract
        run: python -m pytest tests/ui/test_report_export.py -q

      - name: Build onedir artifact
        shell: pwsh
        run: |
          ./scripts/build_exe.ps1 -Version "ci.${{ github.run_number }}.0" -SkipInstall

      - name: Validate build metadata and launch executable
        shell: pwsh
        run: |
          $releaseRoot = Join-Path $PWD "dist/releases/ci.${{ github.run_number }}.0"
          $appRoot = Join-Path $releaseRoot "LocalEngineeringAssistant"
          $exePath = Join-Path $appRoot "LocalEngineeringAssistant.exe"
          $metadataPath = Join-Path $appRoot "build-info.json"
          if (-not (Test-Path -LiteralPath $exePath)) { throw "Missing executable: $exePath" }
          if (-not (Test-Path -LiteralPath $metadataPath)) { throw "Missing build metadata: $metadataPath" }
          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
          if ($metadata.version -ne "ci.${{ github.run_number }}.0") { throw "Unexpected build version" }
          if ([string]::IsNullOrWhiteSpace($metadata.build_id)) { throw "Missing build_id" }
          if ([string]::IsNullOrWhiteSpace($metadata.git_commit)) { throw "Missing git_commit" }

          $fatigueProbe = Start-Process -FilePath $exePath -ArgumentList "--fatigue-package-smoke" -Wait -PassThru
          if ($fatigueProbe.ExitCode -ne 0) {
            throw "Packaged fatigue/SciPy/PDF smoke failed with code $($fatigueProbe.ExitCode)"
          }

          $process = Start-Process -FilePath $exePath -PassThru
          try {
            Start-Sleep -Seconds 10
            if ($process.HasExited) {
              throw "Packaged app exited during launch smoke with code $($process.ExitCode)"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
              $process.WaitForExit(10000)
            }
          }
